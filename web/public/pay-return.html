<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>__MESYNC_BOT_NAME__ — оплата</title>
  <!-- Страница возврата после привязки/оплаты на странице ЮKassa (открывается во
       внешнем браузере). Статус привязки приложение подхватывает само (поллинг). -->
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #fff; color: #111; display: flex; min-height: 100vh;
           align-items: center; justify-content: center; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #000; color: #fff; } }
    .box { padding: 32px 24px; max-width: 340px; }
    .ok { font-size: 52px; }
    h1 { font-size: 20px; margin: 14px 0 8px; }
    p { font-size: 15px; line-height: 1.45; opacity: 0.7; margin: 0; }
  </style>
</head>
<body>
  <div class="box">
    <div class="ok">✅</div>
    <h1>Готово</h1>
    <p>Эту вкладку можно закрыть. Вернитесь в приложение __MESYNC_BOT_NAME__ — статус обновится автоматически в течение пары секунд.</p>
  </div>
</body>
</html>
