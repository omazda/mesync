worker_processes auto;
error_log /dev/stderr notice;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;

    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream mesync_app {
        zone mesync_app 64k;
        server app:8090 resolve;
    }

    upstream mesync_pgadmin {
        zone mesync_pgadmin 64k;
        server pgadmin:5050 resolve;
    }

    client_max_body_size 2g;
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    map $http_x_forwarded_for $client_forwarded_for {
        default $http_x_forwarded_for;
        "" $remote_addr;
    }

    map $http_x_forwarded_proto $public_scheme {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    server {
        listen 8080;
        server_name _;
        absolute_redirect off;

        location = /admin/psql {
            return 308 /admin/psql/;
        }

        location ^~ /admin/psql/ {
            rewrite ^/admin/psql/(.*)$ /$1 break;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Script-Name /admin/psql;
            proxy_set_header X-Scheme $public_scheme;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $client_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_redirect off;
            proxy_pass http://mesync_pgadmin;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $public_scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $client_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_pass http://mesync_app;
        }
    }
}
