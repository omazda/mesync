# Локальный Telegram Bot API сервер (telegram-bot-api) в режиме --local.
#
# Зачем: облачный api.telegram.org жёстко ограничивает кросс-мессенджерный перенос медиа
# (скачивание ≤20 МБ через getFile, multipart-загрузка ≤50 МБ). Свой сервер В РЕЖИМЕ --local
# снимает это: скачивание без лимита, загрузка до 2000 МБ (docs/telegram/.../04-api-reference.md,
# раздел «Using a Local Bot API Server»; подтверждено исходниками telegram-bot-api — лимиты
# сняты ИМЕННО под флагом --local). Тогда кросс-мессенджер MAX↔TG ограничен ТОЛЬКО трафиком
# (TG-сторона до 2000 МБ, MAX-сторона до 4 ГБ).
#
# ВАЖНО: --local меняет поведение getFile — file_path становится АБСОЛЮТНЫМ путём файла на
# диске сервера (а не относительным HTTP-путём). Поэтому рабочая папка монтируется на хост по
# ТОМУ ЖЕ пути (/var/lib/telegram-bot-api), и host-сервис mesync-app читает файл прямо с диска
# (telegram_sync/client.py определяет абсолютный путь и не идёт по HTTP). См. README.md.
#
# api_id/api_hash берутся ТОЛЬКО из ./​.env (см. README.md); в git они не попадают.
# Запуск:  docker compose -f deploy/telegram-bot-api/docker-compose.yml up -d

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    env_file:
      - .env            # TELEGRAM_API_ID и TELEGRAM_API_HASH (создать рядом, см. README)
    environment:
      TELEGRAM_LOCAL: 1                 # --local: снимает лимиты (скачивание без лимита, загрузка до 2000 МБ)
      # Внутри контейнера слушаем все интерфейсы (0.0.0.0) — иначе проброшенный порт был бы
      # недостижим (Docker форвардит через bridge-IP контейнера, а не через его 127.0.0.1).
      # Доступ СНАРУЖИ ограничивает привязка порта к 127.0.0.1 ниже, а не эта переменная.
      TELEGRAM_HTTP_IP_ADDRESS: 0.0.0.0
      TELEGRAM_HTTP_PORT: 8081
      # TELEGRAM_VERBOSITY: 2           # раскомментировать для подробных логов при отладке
    ports:
      - "127.0.0.1:8081:8081"   # НЕ менять 127.0.0.1 — иначе незащищённый Bot API сервер
                                # (раздаёт методы по токену) окажется открыт в сеть.
                                # Доступ нужен только host-сервису mesync-app: http://127.0.0.1:8081
    volumes:
      # Рабочая папка сервера примонтирована на хост по ОДИНАКОВОМУ пути — чтобы абсолютный
      # file_path из getFile (--local) был валиден и для mesync-app на хосте (чтение с диска,
      # без повторной перекачки). Здесь же копятся скачанные/загружаемые файлы — следить за местом.
      - /var/lib/telegram-bot-api:/var/lib/telegram-bot-api
    healthcheck:
      # TCP-проверка порта (busybox nc есть в образе): слушает → healthy, refused → unhealthy.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
